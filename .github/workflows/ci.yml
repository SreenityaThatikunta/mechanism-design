name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Rebuild figures and tables
        run: python -m mechanism_design.cli all

      - name: Check committed numbers are up to date
        # The pipeline is seeded, so a rerun must reproduce every committed
        # number byte for byte. If it does not, either the results are stale or
        # a change moved the numbers without anyone noticing.
        #
        # Figures are deliberately excluded: matplotlib rasterises text through
        # the platform's font stack, so a PNG built on macOS and the same PNG
        # built on this runner differ in bytes while being identical plots.
        # Asserting on them would fail for reasons that say nothing about
        # correctness. The CSVs and data.json are plain text and are stable.
        run: git diff --exit-code --stat results/tables web/data.json
