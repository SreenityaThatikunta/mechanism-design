name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Rebuild figures and tables
        run: python -m mechanism_design.cli all

      - name: Check committed results are up to date
        # The pipeline is seeded, so a rerun must reproduce the committed output
        # byte for byte. If it does not, either the results are stale or a change
        # altered the numbers without anyone noticing.
        run: git diff --exit-code --stat docs/
